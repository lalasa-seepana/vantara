services:
  db:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vantara}
      POSTGRES_DB: ${POSTGRES_DB:-vantara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python -m src.utils.setup first}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vantara}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vantara}
      CONFIG_PATH: /app/config/config.yaml
      VANTARA_ARTIFACTS_PATH: /app/models_artifacts
      VANTARA_PROCESSED_PATH: /app/data/processed
      VANTARA_INTERIM_PATH: /app/data/interim
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./models_artifacts:/app/models_artifacts:ro
      - ./data/processed:/app/data/processed:ro
      - ./data/interim:/app/data/interim:ro
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
  dashboard:
    build: .
    command: [streamlit, run, frontend/dashboard.py, --server.address=0.0.0.0, --server.port=8501, --server.headless=true, --browser.gatherUsageStats=false, --server.maxUploadSize=2]
    environment:
      API_URL: http://api:8000
      API_TIMEOUT: '30'
    ports:
      - '127.0.0.1:8501:8501'
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
